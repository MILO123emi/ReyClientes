; /etc/php/8.4/fpm/pool.d/reypass.conf
; El pool corre con el mismo usuario que despliega: sin problemas de permisos
; en storage/ ni en database.sqlite.
[reypass]
user = reypass
group = reypass
listen = /run/php/reypass.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Droplet de 1 GB: procesos solo cuando hay visitas.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 20s
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 96
php_admin_value[opcache.validate_timestamps] = 0
