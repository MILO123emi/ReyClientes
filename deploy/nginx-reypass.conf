# /etc/nginx/sites-available/reypass
# Cambiar TU_DOMINIO. certbot agrega después el bloque HTTPS y la redirección.
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    root /var/www/reypass/public;
    index index.php;
    charset utf-8;

    # Fotos de cédula: hasta 8 MB por foto (SPEC §12).
    client_max_body_size 10m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets compilados: tienen hash en el nombre.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/reypass.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Ningún otro .php ni archivos ocultos (.env, .git).
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
